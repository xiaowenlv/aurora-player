name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias aurora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -keystore aurora.keystore \
            -storepass aurora2024 \
            -keypass aurora2024 \
            -dname "CN=Aurora Player, OU=Aurora, O=Aurora, L=Beijing, ST=Beijing, C=CN"
          base64 aurora.keystore > aurora.keystore.b64
          echo "=== BASE64 KEYSTORE (复制下面这段) ==="
          cat aurora.keystore.b64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: aurora.keystore.b64
          retention-days: 7
